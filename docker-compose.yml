# Local dev stack per plan §7A, with documented adaptations:
#
#  * PgBouncer image: the plan's `pgbouncer/pgbouncer` image does not exist on
#    Docker Hub. We use `edoburu/pgbouncer` (maintained community image) with
#    equivalent settings. AUTH_TYPE=scram-sha-256 because postgres:15 defaults
#    to SCRAM password encryption (md5 auth would fail against it).
#  * The backend connects THROUGH PgBouncer in transaction-pooling mode —
#    which is why backend/db/pool.py sets statement_cache_size=0 (§2A).
#  * SECURITY (RLS): the backend authenticates all the way to Postgres as the
#    NON-superuser role `app_user` (created by migration 0007), because a
#    superuser silently bypasses Row-Level Security. So PgBouncer's DB_USER and
#    the backend's DATABASE_URL both use app_user. Migrations still go DIRECT to
#    Postgres as `finai` (superuser/owner), bypassing PgBouncer — see env.py.
#    NOTE: app_user only exists after migration 0007 runs; PgBouncer connects
#    lazily (on first query), so bring the DB up + migrate before hitting the app.
#  * `version:` key omitted (obsolete in Compose v2).
#
# Bring up infra only:   docker compose up -d postgres redis pgbouncer
# Full stack:            docker compose up -d
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: finai
      POSTGRES_USER: finai
      POSTGRES_PASSWORD: finai
    ports:
      # Host 5433 -> container 5432, to coexist with a locally-installed Postgres
      # that already holds host port 5432. PgBouncer and the backend still reach
      # Postgres INTERNALLY on 5432 (unchanged); only host-side tools (Alembic,
      # pytest) use 5433 -- see scripts/dev-env.ps1.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finai -d finai"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      # app_user (NON-superuser) so RLS binds. PgBouncer authenticates to
      # Postgres with these creds AND expects clients to present them.
      DB_USER: app_user
      DB_PASSWORD: app_user
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: finai
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction # §2A — transaction pooling
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "20"
    ports:
      - "6432:5432" # host 6432 -> pgbouncer 5432
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      # container-network URLs override anything in .env.
      # app_user (NON-superuser) through PgBouncer so RLS is enforced (see notes).
      DATABASE_URL: postgresql://app_user:app_user@pgbouncer:5432/finai
      REDIS_URL: redis://redis:6379/0
      ENV: development
      SENTRY_DSN: "" # empty = disabled in dev (§3E)
    env_file:
      # JWT/Fernet keys etc. — created locally by scripts/generate_dev_keys.py
      - path: .env
        required: false
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    command: uvicorn backend.main:app --reload --host 0.0.0.0 --port 8000

volumes:
  postgres_data:

# Alembic configuration for the FinAI backend.
# The DB URL is injected at runtime from Settings.sync_database_url() in env.py
# (psycopg2, Postgres DIRECTLY — not through PgBouncer). Do not hard-code a URL
# here; leaving sqlalchemy.url blank forces env.py to supply it.

[alembic]
script_location = %(here)s
prepend_sys_path = .
# Version files live in ./versions
version_locations = %(here)s/versions
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[pytest]
# Run from the repo root:  python -m pytest backend/tests -c backend/pytest.ini
# (rootdir is the repo root so `import backend...` resolves.)
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
filterwarnings =
    ignore::DeprecationWarning

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Folium spots the behavioural bias behind an investment decision and shows what it means for your wealth 20 years from now." />
    <title>Folium · Decision intelligence for investors</title>
    <script>
      // Apply the saved theme before first paint so there is no light flash in dark mode.
      try {
        var t = localStorage.getItem("folium-theme");
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
